name: Build Mod

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  MOD_FOLDER: Sins-and-Omens

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Stage mod into correctly named folder
        run: |
          mkdir -p "staging/${MOD_FOLDER}"
          rsync -av \
            --exclude=".git" \
            --exclude=".github" \
            --exclude="staging" \
            --exclude="artwork_greed.png" \
            ./ "staging/${MOD_FOLDER}/"

      - name: Zip mod folder
        run: |
          cd staging
          zip -r "../${MOD_FOLDER}.zip" "${MOD_FOLDER}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MOD_FOLDER }}
          path: ${{ env.MOD_FOLDER }}.zip

      - name: GitHub Release and ZIP
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.MOD_FOLDER }}.zip
          generate_release_notes: true