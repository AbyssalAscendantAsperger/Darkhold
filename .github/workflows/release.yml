name: Build Mod

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  MOD_FOLDER: Sins-and-Omens

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify mod folder
        run: |
          test -f "${MOD_FOLDER}/mod.xml" || { echo "ERROR: ${MOD_FOLDER}/mod.xml not found - did the mod folder get renamed?"; exit 1; }

      - name: Zip mod folder (player files only, dev tools excluded)
        run: |
          zip -r "${MOD_FOLDER}.zip" "${MOD_FOLDER}" \
            -x "${MOD_FOLDER}/tools/*" \
            -x "${MOD_FOLDER}/None" \
            -x "${MOD_FOLDER}/.luarc.json" \
            -x "${MOD_FOLDER}/.gitignore" \
            -x "${MOD_FOLDER}/_preview_*" \
            -x "${MOD_FOLDER}/artwork_*"
          echo "--- Zip contents ---"
          unzip -l "${MOD_FOLDER}.zip"

      - name: Sanity check zip
        run: |
          if unzip -l "${MOD_FOLDER}.zip" | grep -q "tools/"; then
            echo "ERROR: tools/ leaked into the zip!"; exit 1
          fi
          unzip -l "${MOD_FOLDER}.zip" | grep -q "init.lua" || { echo "ERROR: init.lua missing from zip!"; exit 1; }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MOD_FOLDER }}
          path: ${{ env.MOD_FOLDER }}.zip

      - name: GitHub Release and ZIP
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.MOD_FOLDER }}.zip
          generate_release_notes: true